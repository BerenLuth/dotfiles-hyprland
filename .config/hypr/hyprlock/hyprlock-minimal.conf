# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# Hyprlock
# Original config submitted by https://github.com/SherLock707

# Sourcing colors generated by wallust
source = $HOME/.cache/wal/colors-hyprland.conf
source = ~/.config/hypr/custom/variables.conf   # we need this to access $lockscreenMainMonitor
$Scripts = $HOME/.config/hypr/scripts
$FONT = Google Sans Flex, Bold

general {
    grace = 1
    ignore_empty_input = true
    enable_fingerprint = true
}

auth {
    fingerprint:enabled = true
    fingerprint:ready_message =
    fingerprint:present_message =「 Welcome back, $USER 」
}

background {
    monitor = $lockscreenMainMonitor
	#path = screenshot   # screenshot of your desktop
    color = rgba(0,10,0,1)

    # all these options are taken from hyprland, see https://wiki.hyprland.org/Configuring/Variables/#blur for explanations
    noise = 0.2
    contrast = 1.000 # Vibrant!!!
}


input-field {
    monitor = $lockscreenMainMonitor
    size = 180, 32
    outline_thickness = 2
    dots_size = 0.28 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = $color5
    inner_color = rgba(0,0,0,0.3)
    font_color = $color12
    font_size = 36
    fade_on_empty = true
    placeholder_text = <i>Speak, friend, and enter</i> # Text rendered in the input box when it's empty.
    hide_input = false
    rounding = 8
    invert_numlock = true

    position = 0, 80
    halign = center
    valign = bottom
    zindex = 10
}


label {
    monitor = $lockscreenMainMonitor
    text = cmd[update:1000] echo "<b><big> $(date +"%H:%M") </big></b>"
    color = $color1
    font_size = 50
    font_family = MesloLGS Nerd Font Mono
    shadow_passes = 3
    shadow_size = 1
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}


label {
    monitor = $lockscreenMainMonitor
    text = cmd[update:60000] echo "󰁹 $(cat /sys/class/power_supply/BAT0/capacity)%"
    color = $color1
    font_size = 16
    font_family = MesloLGS NF
    shadow_passes = 3
    shadow_size = 1

    position = 0, -65
    halign = center
    valign = center
    zindex = 10
}

label {
    monitor = $lockscreenMainMonitor
    text = cmd[update:5000] echo "󰖩 $(nmcli -t -f active,ssid dev wifi | awk -F: '$1=="yes" {print $2}')"
    color = $color12
    font_size = 14
    font_family = MesloLGS NF
    shadow_passes = 3
    shadow_size = 1

    position = -15, -15
    halign = right
    valign = top
    zindex = 10
}

# User
label {
    monitor = $lockscreenMainMonitor
    text =  $USER
    color = $color12
    font_size = 16
    font_family = MesloLGS NF
    shadow_passes = 3
    shadow_size = 1

    position = 0, 130
    halign = center
    valign = bottom
    zindex = 10
}

###############
# FINGERPRINT #
###############

# fingerprint icon label, print only if fprintd is installed
label {
    monitor = $lockscreenMainMonitor
    text = cmd[update:18000000] type fprintd-verify &> /dev/null && echo "〉󰈷〈"
    color = $color1
    font_size = 16
    font_family = MesloLGS NF
    shadow_passes = 0
    shadow_size = 0

    position = 0, 30
    halign = center
    valign = bottom
    zindex = 10
}

# fingerprint prompt (comes from hyprlock auth)
label {
    monitor = $lockscreenMainMonitor
    text = $FPRINTPROMPT
    color = $color2
    font_size = 10
    font_family = MesloLGS NF
    position = 0, 10
    halign = center
    valign = bottom
    zindex = 10
}
